server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/authdb
    username: root
    password: root
    jpa:
        hibernate:
          # Options: none | validate | update | create | create-drop
          # update creates missing tables/columns without dropping data (recommended for development)
          ddl-auto: update
        show-sql: true
        properties:
          hibernate:
            dialect: org.hibernate.dialect.MySQL8Dialect
            format_sql: true


  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka