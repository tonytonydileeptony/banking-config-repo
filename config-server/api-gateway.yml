server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-server
          uri: lb://AUTH-SERVER
          predicates:
            - Path=/auth/**

        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/accounts/**

        - id: transaction-service
          uri: lb://TRANSCATION-SERVICE
          predicates:
            - Path=/transactions/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


  instance:
    hostname: localhost
    prefer-ip-address: true
