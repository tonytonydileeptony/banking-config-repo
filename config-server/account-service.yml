server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/accountdb
    username: root
    password: root
    jpa:
      hibernate:
        # Options: none | validate | update | create | create-drop
        # update creates missing tables/columns without dropping data (recommended for development)
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQL8Dialect
          format_sql: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true

# AWS Configuration - Credentials should be set as environment variables
# Set the following environment variables in your deployment:
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# DO NOT hardcode credentials in this file
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ap-south-1

# S3 bucket configuration
aws:
  s3:
    bucket: trinatraomni
